services:
  llm-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: multi-llm-abstraction-layer:latest
    container_name: llm-service
    restart: unless-stopped
    env_file:
      - ../.env
    # Matches the PORT default in .env.example; update both sides if you
    # override PORT in .env.
    ports:
      - '3000:3000'
